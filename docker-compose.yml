# Compose — OEE Têxtil (Walking Skeleton)
#
# Serviços: Mosquitto (broker MQTT), TimescaleDB (PostgreSQL + time-series),
# e Consumidor (Fase 5: ingestão MQTT → banco).
# Rede bridge oee-network compartilhada. Volume pgdata para persistência.
#
# Uso:
#   make up          # sobe mosquitto + timescaledb
#   make build       # build da imagem do consumidor
#   docker compose up -d  # sobe todos os serviços
#   make ps          # verifica status
#   make down        # para tudo
#   make clean       # para tudo + remove volume

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: oee-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - oee-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -t '$$SYS/#' -C 1 -T 5 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: oee-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: oee
      POSTGRES_PASSWORD: oee_dev
      POSTGRES_DB: oee_textil
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - oee-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oee -d oee_textil"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  consumidor:
    build: .
    container_name: oee-consumidor
    environment:
      DATABASE_URL: postgresql://oee:oee_dev@timescaledb:5432/oee_textil
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
    volumes:
      - ./data:/app/data
    networks:
      - oee-network
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

networks:
  oee-network:
    driver: bridge
    name: oee-network

volumes:
  pgdata:
    name: oee-pgdata
