[project]
name = "dev-fullstack-pleno-desafio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiomqtt>=2.5.1",
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "paho-mqtt>=2.1.0",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oee_textil"]

[tool.ruff]
target-version = "py314"
src = ["src"]
lint.select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
lint.ignore = ["B008"]  # B008: FastAPI requer Query/Depends em defaults

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.14"
mypy_path = "src"
packages = ["oee_textil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: conectividade com infraestrutura externa (Mosquitto, TimescaleDB)",
]
