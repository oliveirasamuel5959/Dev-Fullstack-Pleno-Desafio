# Mosquitto MQTT Broker — Configuração de desenvolvimento (Fase 2)
#
# Estratégia: ambiente local efêmero. Sem autenticação, sem TLS,
# sem persistência de sessão. Suficiente para o walking skeleton.
#
# Em staging/produção: adicionar TLS, auth, ACLs e persistence.

listener 1883
allow_anonymous true
persistence false

# Log mínimo para depuração durante desenvolvimento
log_type error
log_type warning
log_type notice
